services:
  # docker compose --file docker-compose.dev.yaml exec -it node bash
  node:
    build:
      context: .
      dockerfile: Dockerfile
      target: node-dev
    working_dir: /app
    volumes:
      - ./extensions/cookie-sync:/app/cookie-sync
      - ./tools/auto-resume-downloads:/app/auto-resume-downloads
    command: ["sleep", "infinity"]

  # docker compose --file docker-compose.dev.yaml exec -it app bash
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        - IMAGE_BROWSER_VERSION=X.Y.Z
        - IMAGE_CREATED=2026-01-01T00:00:00Z
    restart: unless-stopped
    environment:
      - DISPLAY=:0
      - BROWSER_LOG_HISTORY=1
    volumes:
      - ./certs:/config/certs
      - ./logs:/config/browser/logs
      - ./downloads:/config/browser/downloads
      - ./user-data:/config/browser/user-data
      - ./cookie.json:/config/browser/cookie.json
    ports:
      - 5800:5800
